<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portal Casa Sam</title>

  <!-- ICONO OFICIAL DE CASA SAM PARA LA PESTAÑA DEL NAVEGADOR -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Yr6yCal5JOMQpssp5ktgZ5jYwhbqk0n_">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Yr6yCal5JOMQpssp5ktgZ5jYwhbqk0n_">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #1C542D; /* Verde institucional Casa Sam */
      overscroll-behavior: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>
  <!-- Puente con permisos para cámara, micrófono y evidencias -->
  <iframe 
    id="visorCasaSam"
    src=""
    allow="camera; microphone; geolocation"
    allowfullscreen>
  </iframe>

  <script>
    // TU URL DE GOOGLE APPS SCRIPT TERMINADA EN /exec
    var URL_BASE_APPS_SCRIPT = "PEGA_AQUI_TU_LINK_DE_APPS_SCRIPT_COMPLETO";

    // Pasa automáticamente las sucursales (?suc=Sam 1, ?suc=Sam 2, etc.)
    var parametros = window.location.search;
    var urlFinal = URL_BASE_APPS_SCRIPT + (parametros ? parametros : "");
    
    document.getElementById("visorCasaSam").src = urlFinal;
  </script>
</body>
</html>
