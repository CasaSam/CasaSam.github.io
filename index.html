<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portal Casa Sam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #1C542D; /* Verde oficial Casa Sam */
      overscroll-behavior: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>
  <!-- Puente con permisos activos para cámara, evidencias y pantalla completa -->
  <iframe 
    id="visorCasaSam"
    src=""
    allow="camera; microphone; geolocation"
    allowfullscreen>
  </iframe>

  <script>
    // TU URL DE GOOGLE APPS SCRIPT TERMINADA EN /exec
    var URL_BASE_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzY4vHPz-XmgGVYAYjGLowvx6vf1mcijXtDaxKxw60y8EjkJT0rJj7RXOd6Hnc9nqgd/exec";

    // Pasa automáticamente sucursales si se usan parámetros (ej: ?suc=Sam1)
    var parametros = window.location.search;
    var urlFinal = URL_BASE_APPS_SCRIPT + (parametros ? parametros : "");
    
    document.getElementById("visorCasaSam").src = urlFinal;
  </script>
</body>
</html>
