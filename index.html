<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portal Casa Sam</title>

  <!-- ICONO OFICIAL DE CASA SAM -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Yr6yCal5JOMQpssp5ktgZ5jYwhbqk0n_">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Yr6yCal5JOMQpssp5ktgZ5jYwhbqk0n_">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #1C542D;
      overscroll-behavior: none !important;
      overscroll-behavior-y: none !important;
      touch-action: pan-x pan-y !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* PANTALLA DE CARGA OFICIAL CASA SAM */
    #pantallaCargaCasaSam {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1C542D;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .logo-splash {
      max-width: 130px;
      margin-bottom: 20px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    }

    .spinner-splash {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #EA580C; /* Naranja Casa Sam */
      border-radius: 50%;
      animation: girarSplash 0.8s linear infinite;
    }

    .texto-splash {
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 14px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    @keyframes girarSplash {
      to { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overscroll-behavior: none !important;
      overscroll-behavior-y: none !important;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO INSTITUCIONAL -->
  <div id="pantallaCargaCasaSam">
    <img src="https://lh3.googleusercontent.com/d/1Yr6yCal5JOMQpssp5ktgZ5jYwhbqk0n_" class="logo-splash" alt="Casa Sam">
    <div class="spinner-splash"></div>
    <span class="texto-splash">Iniciando Portal...</span>
  </div>

  <iframe 
    id="visorCasaSam"
    src=""
    allow="camera; microphone; geolocation"
    allowfullscreen>
  </iframe>

  <script>
    var URL_BASE_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzY4vHPz-XmgGVYAYjGLowvx6vf1mcijXtDaxKxw60y8EjkJT0rJj7RXOd6Hnc9nqgd/exec";
    var parametros = window.location.search;
    var urlFinal = URL_BASE_APPS_SCRIPT + (parametros ? parametros : "");
    var visor = document.getElementById("visorCasaSam");
    
    visor.src = urlFinal;

    // Desvanece la pantalla de bienvenida institucional en cuanto carga el sistema
    visor.onload = function() {
      var splash = document.getElementById("pantallaCargaCasaSam");
      if (splash) {
        splash.style.opacity = "0";
        setTimeout(function() {
          splash.style.visibility = "hidden";
          splash.style.display = "none";
        }, 500);
      }
    };
  </script>
</body>
</html>
