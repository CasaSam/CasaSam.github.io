<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portal Casa Sam</title>

  <!-- ICONO OFICIAL DE CASA SAM EN LA PESTAÑA -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1Yr6yCal5JOMQpssp5ktgZ5jYwhbqk0n_">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Yr6yCal5JOMQpssp5ktgZ5jYwhbqk0n_">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #1C542D;
      overscroll-behavior: none !important;
      overscroll-behavior-y: none !important;
      touch-action: pan-x pan-y !important;
    }

    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overscroll-behavior: none !important;
      overscroll-behavior-y: none !important;
    }
  </style>
</head>
<body>
  <!-- PUENTE LIMPIO Y DIRECTO AL PORTAL -->
  <iframe 
    id="visorCasaSam"
    src=""
    allow="camera; microphone; geolocation"
    allowfullscreen>
  </iframe>

  <script>
    var URL_BASE_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzY4vHPz-XmgGVYAYjGLowvx6vf1mcijXtDaxKxw60y8EjkJT0rJj7RXOd6Hnc9nqgd/exec";
    var parametros = window.location.search;
    var urlFinal = URL_BASE_APPS_SCRIPT + (parametros ? parametros : "");
    document.getElementById("visorCasaSam").src = urlFinal;
  </script>
</body>
</html>
